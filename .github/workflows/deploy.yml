# 사이트를 빌드해서 GitHub Pages 로 올린다.
#
# Pages 설정에서 Source 를 "GitHub Actions" 로 둬야 동작한다(Settings → Pages).
# 브랜치 배포(gh-pages) 방식이 아니라서 빌드 결과물을 저장소에 커밋하지 않는다.
#
# 스스로 태그를 지켜보지 않는다. 릴리스가 났을 때 release.yml 이 이 워크플로를 불러
# 준다(workflow_call). 사이트와 내려받는 zip 은 같은 커밋에서 나와야 하는데, 서로 다른
# 트리거로 각자 돌면 그 보장이 없다 - 한쪽만 성공하거나 순서가 엇갈릴 수 있다.
#
# 수동 실행은 남겨 둔다. 되돌릴 때(옛 태그를 골라 다시 배포)와 Variables 만 바꿨을 때 쓴다.
name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      ref:
        description: 배포할 지점. 비우면 부르는 쪽의 ref 를 쓴다.
        type: string
        required: false
  # 실행 화면에서 브랜치·태그를 골라 그 지점으로 배포한다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages 가 OIDC 로 배포 토큰을 받아온다. 빠지면 배포 단계에서 권한 오류가 난다.
  id-token: write

# 배포는 한 번에 하나만. 연달아 푸시하면 앞선 실행을 버리고 마지막 것만 올린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 빌드가 커밋 해시를 박으므로(vite.config.ts 의 BUILD_INFO) .git 이 필요하다.
      # 얕은 클론이라도 HEAD 는 있으니 fetch-depth 는 기본값으로 둔다.
      #
      # 불려서 도는 경우에는 릴리스 태그를 명시적으로 받아 그 지점을 체크아웃한다.
      # 부르는 쪽의 ref 는 main 이라, 그대로 두면 태그가 붙은 뒤 들어온 커밋까지 섞인다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # package.json 의 packageManager 필드에서 pnpm 버전을 읽는다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 배포 주소를 Pages 설정에서 직접 읽어온다. 커스텀 도메인이면 루트(/)와 그 도메인을,
      # 아니면 /<저장소이름>/ 과 https://<소유자>.github.io 를 준다.
      # 주소를 워크플로에 적어 두지 않는 이유가 이것이다 - 설정에서 도메인을 바꾸면 그대로 따라간다.
      - id: pages
        uses: actions/configure-pages@v6

      # 배포 주소(base)를 한 번 계산해 두 빌드가 나눠 쓴다.
      #
      # 랜딩은 도메인 루트(`$BASE`), exporter 는 그 아래 `$BASE`run/ 다. base 가 틀리면
      # 빌드는 성공하는데 브라우저에서 JS·CSS 가 404 로 죽는다. Vite 는 끝에 `/` 가 있어야
      # 하므로 보정한다. 최종 URL 을 바꾸고 싶으면(서브도메인 등) 여기와 아래 env 만 손댄다.
      - name: Resolve bases
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          case "$BASE" in */) ;; *) BASE="$BASE/" ;; esac
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "APP_BASE=${BASE}run/" >> "$GITHUB_ENV"
          echo "base=$BASE  run=${BASE}run/  origin=${{ steps.pages.outputs.origin }}"

      # ── exporter(앱) 빌드 → `/run/` ────────────────────────────────────────────
      # 루트가 exporter 프로젝트다. 랜딩과 install·빌드가 완전히 분리돼 있다.
      - run: pnpm install --frozen-lockfile

      # 타입체크를 따로 돌린다. 아래 빌드에 --base 를 붙여야 해서 `pnpm build`
      # (= tsc -b && vite build)를 그대로 쓸 수 없다 — pnpm 은 스크립트 뒤 인자를 무시한다.
      - run: pnpm exec tsc -b

      - name: Build exporter
        run: pnpm exec vite build --base="$APP_BASE"
        env:
          # "소스 보기" 링크. 배포본과 같은 커밋이 올라간 저장소를 가리킨다(포크해도 따라간다).
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # 내보낸 문서 하단의 "이 도구가 돌아가는 곳" 주소.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # "받아서 실행"(방식 고르기)이 거는 내려받기 주소. 비우면 위 저장소의 릴리스에서
          # 코드 기본값 이름으로 조립한다(src/shared/config/release.ts).
          VITE_RELEASE_DOWNLOAD_URL: ${{ vars.VITE_RELEASE_DOWNLOAD_URL }}
          VITE_RELEASE_ASSET_FILE_NAME: ${{ vars.VITE_RELEASE_ASSET_FILE_NAME }}
          # 공용 api_id. 둘 다 있어야 성립한다 — 한쪽만 채우면 직접 입력 화면으로 떨어진다.
          VITE_TELEGRAM_API_ID: ${{ vars.VITE_TELEGRAM_API_ID || secrets.VITE_TELEGRAM_API_ID }}
          VITE_TELEGRAM_API_HASH: ${{ vars.VITE_TELEGRAM_API_HASH || secrets.VITE_TELEGRAM_API_HASH }}
          # 앱 쪽 GA. 있으면 앱 CSP 에 구글 도메인이 열리고 외부 연결 고지가 나온다(기존 방식 유지).
          VITE_GOOGLE_ANALYTICS_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_ID }}
          VITE_GOOGLE_ADSENSE_ID: ${{ vars.VITE_GOOGLE_ADSENSE_ID }}

      # ── 랜딩(홍보) 빌드 → 도메인 루트 ──────────────────────────────────────────
      # landing/ 는 자체 lockfile·의존성을 가진 독립 프로젝트다.
      - name: Install landing
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Build landing
        working-directory: landing
        run: pnpm exec vite build --base="$BASE"
        env:
          # canonical·hreflang·sitemap 은 절대 주소여야 한다. 비우면 상대 경로로 떨어진다.
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          # "시작하기" 가 가리키는 exporter 진입 주소. 지금은 같은 도메인의 `$BASE`run/ 다.
          # 서브도메인으로 옮기려면 여기에 그 절대 주소(끝에 /)를 넣는다 — 소스는 안 고친다.
          VITE_APP_URL: ${{ env.APP_BASE }}
          VITE_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # 내려받기 버튼 주소(위 exporter 와 같은 규칙).
          VITE_RELEASE_DOWNLOAD_URL: ${{ vars.VITE_RELEASE_DOWNLOAD_URL }}
          VITE_RELEASE_ASSET_FILE_NAME: ${{ vars.VITE_RELEASE_ASSET_FILE_NAME }}
          # 랜딩 쪽 GA. 랜딩은 자기 analytics.js 로 첫 화면 방문을 집계한다.
          VITE_GOOGLE_ANALYTICS_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_ID }}
          VITE_GOOGLE_ADSENSE_ID: ${{ vars.VITE_GOOGLE_ADSENSE_ID }}

      # ── 합성: 루트=랜딩, /run/=exporter ────────────────────────────────────────
      # 두 산출물을 한 아티팩트로 합친다. 랜딩이 `/`(sitemap·robots·_headers 포함)을,
      # exporter 가 `/run/`(자체 index·404·_headers)를 차지한다.
      - name: Compose artifact
        run: |
          rm -rf out && mkdir -p out/run
          cp -a landing/dist/. out/
          cp -a dist/. out/run/
          echo "=== out tree (2 depth) ===" && find out -maxdepth 2 -type f | sort | head -40

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # 새 판을 올렸으니 엣지에 남은 옛 판을 지운다.
      #
      # **이게 없으면 배포가 최대 10분 늦게 보인다.** HTML 은 엣지에서 600초를 살고
      # (`cloudflare/rules/http_request_cache_settings/html-pages.json`) 그 시간이 다 갈
      # 때까지 이전 문서가 나간다. 해시 붙은 번들은 이름이 바뀌니 상관없지만, 이름이
      # 고정된 것들(HTML·스크린샷·og.png·sitemap.xml)은 지워 줘야 새것이 보인다.
      #
      # **스크립트를 쓰려고 체크아웃한다.** 배포 job 은 원래 아무것도 안 받아 오는데,
      # 퍼지 규칙(어느 호스트를 지울지)이 `cloudflare/settings.json` 에 있다. 빌드한
      # 지점과 같은 곳을 봐야 하므로 ref 도 build 와 똑같이 맞춘다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # 토큰이 없으면 조용히 건너뛴다. 포크한 쪽은 Cloudflare 를 안 쓸 수도 있는데,
      # 그 때문에 배포가 실패하면 안 된다 - 퍼지는 배포가 끝난 뒤의 뒷정리일 뿐이다.
      #
      # 이 토큰은 **캐시 퍼지 권한만** 있으면 된다. zone 을 고칠 수 있는 토큰을 CI 에
      # 두지 말 것 - 새는 자리가 늘어나는데 얻는 것이 없다.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN 이 없어 캐시 퍼지를 건너뛴다."
            exit 0
          fi
          ./cloudflare/purge-cache.sh
