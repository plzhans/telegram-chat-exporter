# 의존성을 주기적으로 올려 준다.
#
# 보안 취약점 대응은 이것 없이도 이미 돌아간다(저장소 설정의 Dependabot security updates).
# 이 파일이 더하는 것은 **평시 업데이트**다 - 액션 버전을 손으로 올리는 일을 없앤다.
version: 2

updates:
  # GitHub Actions. Node 런타임 지원이 끊기는 일이 주기적으로 있어서 이쪽이 특히 값이 있다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 액션은 한꺼번에 올려도 위험이 낮고, PR 이 흩어지면 오히려 안 보게 된다.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 마이너·패치는 묶는다. 매주 PR 이 열 개씩 열리면 아무도 안 본다.
      minor-and-patch:
        update-types: [minor, patch]
      # 메이저도 묶되 **따로** 둔다. 대개 손볼 것이 있어서(vite 6→8, tailwind 3→4 처럼)
      # 마이너와 같은 PR 에 넣으면 쉬운 것까지 함께 막힌다.
      major:
        update-types: [major]
    ignore:
      # GramJS 는 **어떤 자리도 올리지 않는다.** 패치까지 막는 것이 핵심이다.
      #
      # **이 패키지에서 패치 한 칸은 패치가 아니라 플랫폼 교체다.** 같은 패키지에 브라우저용과
      # Node 용을 번갈아 올리기 때문이다.
      #
      #   2.26.21  browser 태그   require("./crypto/crypto")  → WebCrypto
      #   2.26.22  latest  태그   require("crypto")           → Node 내장 모듈
      #
      # 두 버전은 파일 수(226개)도 크기(2.6M)도 같고 실제 차이는 이 require 한 줄인데, 그
      # 한 줄이 브라우저에서 동작 여부를 가른다 - 브라우저에는 `crypto` 모듈이 없어서
      # 인증키 교환 단계에서 `randomBytes is not a function` 으로 죽는다.
      #
      # 즉 버전 번호가 "얼마나 바뀌었나"가 아니라 "어느 플랫폼용인가"를 가리킨다. semver 의
      # 전제가 성립하지 않으므로 patch 라고 안전하다고 볼 수 없다.
      # (자세한 배경은 DEVELOP.ko.md 의 "telegram 버전을 올리지 말 것" 참고)
      #
      # **`update-types` 를 반드시 붙인다.** 이름만 적으면 보안 업데이트까지 막힌다 -
      # 전화번호와 대화 내용을 다루는 라이브러리라 그건 가장 알아야 할 알림이다.
      # `version-update:` 는 평시 업데이트만 가리키므로 보안 PR 은 그대로 올라온다.
      - dependency-name: telegram
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
